<html manifest="Cache.manifest">
<head>
<title>PS4 HOST SCORPION AUTO NO USB-Offline</title>
<style>
html, body {
background-image: url('img.jpg');
background-size: cover !important;
background-position: center center !important;
background-repeat: no-repeat !important;
background-attachment: fixed !important;
background-color: #05161e !important;
color: white;
text-align: center;
margin: 0px;
overflow: hidden;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.status-box {
    margin-top: 150px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(0, 229, 255, 0.3);
    display: inline-block;
    padding: 50px 70px;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
}
#progress {
    font-size: 32px;
    font-weight: bold;
    color: #e0faff;
    text-shadow: 0 0 15px rgba(0, 229, 255, 0.8);
    letter-spacing: 2px;
}
/* Animated Loader from your successful layout */
.loader {
    margin: 30px auto;
    width: 50px;
    height: 50px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top: 3px solid #00e5ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Stable Designer Credit Rectangle from your successful layout */
.designer-credit {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 229, 255, 0.4);
    padding: 10px 40px;
    border-radius: 4px;
    font-size: 22px;
    letter-spacing: 2px;
    color: #00e5ff;
    white-space: nowrap;
}
.designer-credit span { color: white; font-weight: bold; }
a {
text-decoration: none;
}
</style>
</head>
<body>
    <div class="status-box">
        <h1 id="progress">Preparing Scorpio Caching...</h1>
        <div class="loader"></div>
    </div>

    <div class="designer-credit">
        Designed and Compiled By: <a href="https://github.io" style="color: #00e5ff; text-decoration: none;"><span>Ahmed Essam</span></a>
    </div>

<script>
try {
    history.replaceState(null,null,'index.html');
    var histlength=history.length;
    history.go(-histlength);
} catch(e) {}

function DLProgress(e){
    if (e.total) {
        var Percent = (Math.round(e.loaded / e.total * 100));
        document.getElementById("progress").innerHTML = "Installing Scorpio Cache: " + Percent + "%";
    }
}

function DisplayCacheProgress(){
    document.getElementById("progress").innerHTML = "Scorpio Cache Installed Successfully ✔";
    setTimeout(function(){
        document.getElementById("progress").innerHTML = "Now Close And Re-Open Your Browser ..";
    }, 2500);
}

window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
</body>
</html>
